<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kazici</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237077d4'/%3E%3Cpath d='M10 9v14M10 16l8-7M13 13.5l6 9.5' stroke='white' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <script>
    // Apply the theme before the page is drawn (no flash)
    try { const t = localStorage.getItem("kazici-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9"/><path d="M10 9v14M10 16l8-7M13 13.5l6 9.5"/></svg>
        </span>
        <span class="brand-text"><b>kazici</b><small>learn · run</small></span>
      </div>
      <nav class="nav" id="nav">
        <a href="#/run" data-page="run"><svg viewBox="0 0 24 24"><path d="M7 5v14l11-7z"/></svg><span>Run</span></a>
        <a href="#/learn" data-page="learn"><svg viewBox="0 0 24 24"><path d="M12 3l2.2 5.6L20 9.5l-4.5 3.8L17 19l-5-3-5 3 1.5-5.7L4 9.5l5.8-.9z"/></svg><span>Learn</span></a>
        <a href="#/rules" data-page="rules"><svg viewBox="0 0 24 24"><path d="M8 4H6a2 2 0 0 0-2 2v4l-2 2 2 2v4a2 2 0 0 0 2 2h2M16 4h2a2 2 0 0 1 2 2v4l2 2-2 2v4a2 2 0 0 1-2 2h-2"/></svg><span>Rules</span></a>
        <a href="#/outputs" data-page="outputs"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg><span>Results</span></a>
        <a href="#/jobs" data-page="jobs"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span>Jobs</span><em class="badge" id="jobBadge" hidden></em></a>
      </nav>
      <div class="side-foot">
        <button class="power" id="powerBtn" title="Stop server" aria-label="Stop server">
          <svg viewBox="0 0 24 24"><path d="M12 3v8M6.4 6.4a8 8 0 1 0 11.2 0"/></svg><span>Stop server</span>
        </button>
        <div class="theme" role="radiogroup" aria-label="Theme">
          <button data-theme-set="light" title="Light" aria-label="Light theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
          <button data-theme-set="system" title="System" aria-label="System theme"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
          <button data-theme-set="dark" title="Dark" aria-label="Dark theme"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
        </div>
      </div>
    </aside>
    <main class="main" id="main"></main>
  </div>
  <div class="toasts" id="toasts"></div>
  <script src="/static/app.js"></script>
</body>
</html>
